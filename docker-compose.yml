
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    environment:
      VITE_API_PROXY_TARGET: http://host.docker.internal:8000
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    extra_hosts:
      - "host.docker.internal:host-gateway"